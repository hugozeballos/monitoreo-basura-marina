<body>
  <body>
    <div id="caja_sobremapa">
        <div id="caja_titulo">
            <h2 id="titulo_mapa">Proyectos de muestreo de calidad de Agua</h2>
        </div>
    </div>
    <div id="mapa"></div>
        
    
        <!-- Script para visualizar datos en el mapa -->
        <script src="https://code.jquery.com/jquery-3.6.4.min.js"></script>
        <!-- <script src="https://d3js.org/d3.v5.min.js"></script> -->
     <!-- Make sure you put this AFTER Leaflet's CSS -->

         integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
         crossorigin=""></script> -->
        <script>
            function initMap(data) {
                // Calcular límites geográficos
                var bounds = L.latLngBounds();
                data.forEach(function(d) {
                    bounds.extend(L.latLng(d.latitud, d.longitud));
                });
    
                // Crear el mapa con Leaflet centrado en los límites
                var map = L.map('mapa').fitBounds(bounds);
    
                L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                    attribution: '© OpenStreetMap contributors'
                }).addTo(map);
    
                // Crear un grupo de marcadores para usar con markercluster
                var markers = L.markerClusterGroup();
    
                // Agregar puntos al mapa con D3
                data.forEach(function(d) {
                    // Crear contenido HTML para el popup con datos específicos
                    var popupContent = "<h4>Monitoreo N°" + d.monitoreo_id + "<br>Fecha:" + d.fecha_monitoreo + "</h4>";
                    
                    popupContent += "<strong>Descripcion:</strong> <span style='color: green;'>" + d.descripcion + "</span><br>";
                    popupContent += "<strong>Plaastico Pesca:</strong> " + d.plastico_pesca_kg +"kg <br>";
                    popupContent += "<strong>Plastico uso domestico:</strong> " + d.plastico_uso_domestico_kg +"kg <br>";
                    popupContent += "<strong>Cuerdas y cordeles:</strong> " + d.cuerdas_y_cordeles_kg +"kg <br>";
                    popupContent += "<strong>Vidrios:</strong> " + d.vidrios_kg +"kg <br>";
                    popupContent += "<strong>Lata:</strong> " + d.latas_kg +"kg <br>";
                    popupContent += "<strong>Textil:</strong> " + d.textil_kg +"kg <br>";
                    popupContent += "<strong>Papel:</strong> " + d.papel_kg +"kg <br>";
                    popupContent += "<strong>Neumaticos:</strong> " + d.neumaticos_kg +"kg <br>";

    
    
                    var marker = L.marker([d.latitud, d.longitud]).bindPopup(popupContent).openPopup();
                    markers.addLayer(marker);
                });
    
                // Añadir el grupo de marcadores al mapa
                map.addLayer(markers);
            }

            // Iniciar el mapa y retener la referencia del mapa para su uso posterior

            // Realizar solicitud AJAX para obtener datos del mapa
            $(document).ready(function() {
                $.ajax({
                    url: '/obtener_datos_mapa/',
                    type: 'GET',
                    success: function(data) {
                        console.log(data);
    
                        // Llamar a la función para inicializar el mapa con los datos
                        initMap(data);
                    },
                    error: function(error) {
                        console.error('Error al obtener datos del mapa:', error);
                    }
                });
            });
        </script>
